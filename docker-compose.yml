services:
  q-learning:
    build: .
    command: ["Q_learning/main.py"]
    volumes:
      - ./Q_learning:/app/Q_learning
    stdin_open: true
    tty: true

  sarsa:
    build: .
    command: ["Sarsa/main.py"]
    volumes:
      - ./Sarsa:/app/Sarsa
    stdin_open: true
    tty: true

  montecarlo:
    build: .
    command: ["MonteCarlo/main.py"]
    volumes:
      - ./MonteCarlo:/app/MonteCarlo
    stdin_open: true
    tty: true

  dqn:
    build: .
    command: ["deep_Q_learning/main.py"]
    volumes:
      - ./deep_Q_learning:/app/deep_Q_learning
    stdin_open: true
    tty: true

  bruteforce:
    build: .
    command: ["bruteforce.py"]
    stdin_open: true
    tty: true

  benchmark:
    build: .
    command: ["benchmark.py"]
    volumes:
      - ./Q_learning:/app/Q_learning
      - ./Sarsa:/app/Sarsa
      - ./MonteCarlo:/app/MonteCarlo
      - ./deep_Q_learning:/app/deep_Q_learning
      - ./benchmark.py:/app/benchmark.py
      - ./results:/app/results
    stdin_open: true
    tty: true

  # Entraînement instrumenté MLflow (Phases 2-3).
  # Override l'algo/les options : docker compose run --rm train sarsa --register
  train:
    build: .
    entrypoint: ["python3", "-m", "mlops.train"]
    command: ["qlearning", "--register"]
    volumes:
      - ./mlruns:/app/mlruns
      - ./models:/app/models
    environment:
      - GIT_PYTHON_REFRESH=quiet

  # UI MLflow pour explorer les runs (http://localhost:5000).
  mlflow-ui:
    build: .
    entrypoint: ["mlflow", "ui"]
    command: ["--backend-store-uri", "file:/app/mlruns",
              "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  # API d'inférence FastAPI (Phase 4) — sert le modèle champion.
  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "8000:8000"
    environment:
      # 'auto' = meilleur champion tous algos ; ou 'sarsa', 'qlearning', 'dqn'...
      - TAXI_SERVE_ALGORITHM=auto
    volumes:
      - ./models:/app/models:ro   # modèles entraînés (lecture seule)
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data: